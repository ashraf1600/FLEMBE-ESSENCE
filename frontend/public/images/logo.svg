<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="feBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4B1D3F" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#2E1127" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#190a16" stop-opacity="1"/>
    </radialGradient>

    <!-- Clip Path for Circular Image Mask -->
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="185"/>
    </clipPath>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .fe-orbit {
        animation: feOrbitSpin 26s linear infinite;
        transform-origin: 250px 250px;
      }
      .fe-twinkle-1 {
        animation: feStarPulse 2.8s ease-in-out infinite alternate;
        transform-origin: 410px 100px;
      }
      .fe-twinkle-2 {
        animation: feStarPulse 3.4s ease-in-out infinite alternate 1.2s;
        transform-origin: 90px 380px;
      }
      .fe-aura {
        animation: feAuraBreath 4s ease-in-out infinite alternate;
        transform-origin: 250px 250px;
      }
      @keyframes feOrbitSpin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes feStarPulse {
        0%   { opacity: 0.3; transform: scale(0.7) rotate(0deg); }
        50%  { opacity: 1;   transform: scale(1.2) rotate(45deg); }
        100% { opacity: 0.4; transform: scale(0.85) rotate(90deg); }
      }
      @keyframes feAuraBreath {
        0%   { opacity: 0.35; transform: scale(0.96); }
        100% { opacity: 0.8;  transform: scale(1.04); }
      }
    </style>
  </defs>

  <!-- Luxury Circular Medallion Background -->
  <circle cx="250" cy="250" r="236" fill="url(#feBgGlow)" stroke="#D8A7B1" stroke-width="2.5" stroke-opacity="0.5"/>
  <circle cx="250" cy="250" r="224" fill="none" stroke="#E8D9C1" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Rotating Dashed Orbit Ring -->
  <circle class="fe-orbit" cx="250" cy="250" r="212" fill="none" stroke="#D8A7B1" stroke-width="2" stroke-dasharray="8 16 3 16" stroke-opacity="0.75"/>

  <!-- Inner Gold Rim -->
  <circle cx="250" cy="250" r="192" fill="none" stroke="#E8D9C1" stroke-width="1.8" stroke-opacity="0.5"/>

  <!-- Original Brand Logo Image Clipped Nicely in the Center -->
  <image href="/images/logo.png" xlink:href="/images/logo.png" x="65" y="65" width="370" height="370" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Sparkling Diamond Stars -->
  <g class="fe-twinkle-1" filter="url(#sparkleGlow)">
    <path d="M410 85 Q410 100 425 100 Q410 100 410 115 Q410 100 395 100 Q410 100 410 85 Z" fill="#ffffff"/>
    <circle cx="410" cy="100" r="3" fill="#E8C4CB"/>
  </g>
  <g class="fe-twinkle-2" filter="url(#sparkleGlow)">
    <path d="M90 368 Q90 380 102 380 Q90 380 90 392 Q90 380 78 380 Q90 380 90 368 Z" fill="#E8D9C1"/>
  </g>
</svg>
