services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Django REST Backend Web Service
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: flembe-essence-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flembe-essence-db
          property: connectionString
      - key: DB_ENGINE
        value: postgresql
      - key: AUTO_SEED
        value: "true"
      # Comma-separated allowed frontend origins (update if using a custom domain)
      - key: CORS_ALLOWED_ORIGINS
        value: "https://flembe-essence-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://flembe-essence-frontend.onrender.com"
      # Admin superuser auto-creation on first deploy (optional)
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Cloudinary image storage (optional - recommended for persistent user uploads)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. React / Vite Frontend Static Site
  # ─────────────────────────────────────────────────────────────────────────────
  - type: static
    name: flembe-essence-frontend
    rootDir: frontend
    plan: free
    buildCommand: "npm run build"
    publishPath: "dist"
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://flembe-essence-backend.onrender.com/api/v1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ─────────────────────────────────────────────────────────────────────────────
# 3. PostgreSQL Database
# ─────────────────────────────────────────────────────────────────────────────
databases:
  - name: flembe-essence-db
    databaseName: flembe_essence
    user: flembe_user
    plan: free
